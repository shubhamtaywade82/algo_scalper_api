# Unified infrastructure: the Rails app (control plane, Dhan token owner) and the options agent (execution engine)
# on one Postgres and one Redis. See README.md in this folder before using it.
#
#   docker compose --env-file .env up -d                      # postgres, redis, rails web + jobs (no trading)
#   docker compose --env-file .env --profile agent up -d      # + the options agent (paper unless OTA_MODE says otherwise)
#   docker compose --env-file .env --profile trading up -d    # + the Rails trading daemon (needs Dhan credentials)
#   docker compose --env-file .env --profile dashboard up -d  # + the dashboard on 127.0.0.1:3000
#
# Only the Rails services hold DHAN_PIN / DHAN_TOTP_SECRET. The agent never sees them: it reads the token from Rails.
name: options-trading-infra

x-asa-build: &asa-build
  context: ${ASA_CONTEXT:-../..}
  dockerfile: Dockerfile

x-asa-env: &asa-env
  RAILS_ENV: production
  PORT: "3011"
  PGHOST: postgres
  ALGO_SCALPER_API_DATABASE_PASSWORD: ${ASA_DB_PASSWORD:?set ASA_DB_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?set it (bin/rails db:encryption:init)}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?set it}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?set it}
  API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:?set API_OPERATOR_TOKEN}
  # Production fails closed without this: every dashboard-tier endpoint answers 403 server_configuration_error.
  API_DASHBOARD_TOKEN: ${API_DASHBOARD_TOKEN:?set API_DASHBOARD_TOKEN}
  # Empty keeps settings writes disabled in production (503), which is the safe default.
  SETTINGS_UPDATE_TOKEN: ${SETTINGS_UPDATE_TOKEN:-}
  CABLE_ALLOWED_ORIGINS: http://localhost:${DASHBOARD_PORT:-3000},http://127.0.0.1:${DASHBOARD_PORT:-3000}
  DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:?set DHAN_CLIENT_ID}
  DHAN_PIN: ${DHAN_PIN:-}
  DHAN_TOTP_SECRET: ${DHAN_TOTP_SECRET:-}
  PLACE_ORDER: ${ASA_PLACE_ORDER:-false}
  ENABLE_TRADING_SERVICES: "false"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ASA_DB_PASSWORD: ${ASA_DB_PASSWORD:?set ASA_DB_PASSWORD}
      OTA_DB_PASSWORD: ${OTA_DB_PASSWORD:?set OTA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7
    # noeviction: the agent keeps its rate gate and lease here, and a silent eviction would break them.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: the image's entrypoint only prepares the database for `rails server`, and Rails has four databases.
  asa-migrate:
    image: options-infra-asa
    build: *asa-build
    command: ["bin/rails", "db:prepare"]
    environment: *asa-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  asa-web:
    image: options-infra-asa
    build: *asa-build
    environment: *asa-env
    ports:
      - "127.0.0.1:${ASA_WEB_PORT:-3011}:3011"
    depends_on:
      asa-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3011/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  asa-jobs:
    image: options-infra-asa
    build: *asa-build
    command: ["sh", "-c", "bin/rails solid_queue:load_recurring && bin/jobs"]
    environment: *asa-env
    depends_on:
      asa-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # The Rails trading daemon. Needs real Dhan credentials; it holds the login, so start it before the agent.
  asa-trading:
    profiles: ["trading"]
    image: options-infra-asa
    build: *asa-build
    command: ["bundle", "exec", "rake", "trading:daemon"]
    environment:
      <<: *asa-env
      ENABLE_TRADING_SERVICES: "true"
    depends_on:
      asa-web: { condition: service_healthy }
    stop_grace_period: 60s
    restart: unless-stopped

  asa-dashboard:
    profiles: ["dashboard"]
    build:
      context: ${ASA_CONTEXT:-../..}/dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_DASHBOARD_TOKEN: ${API_DASHBOARD_TOKEN:?set API_DASHBOARD_TOKEN}
    volumes:
      - ./dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:80"
    depends_on:
      asa-web: { condition: service_healthy }
    restart: unless-stopped

  ota:
    profiles: ["agent"]
    build:
      context: ${OTA_CONTEXT:-../../../options-trading-agent}
      dockerfile: Dockerfile
    image: options-infra-ota
    environment:
      MODE: ${OTA_MODE:-paper}
      CONFIG_FILE: config.paper.yml
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:?set DHAN_CLIENT_ID}
      DHAN_TOKEN_AUTHORITY_URL: http://asa-web:3011/api/dhan/token
      DHAN_TOKEN_AUTHORITY_TRUSTED_HOSTS: asa-web
      DHAN_TOKEN_AUTHORITY_KEY: ${API_OPERATOR_TOKEN:?set API_OPERATOR_TOKEN}
      DATABASE_URL: postgres://agent:${OTA_DB_PASSWORD:?set OTA_DB_PASSWORD}@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      DHAN_SHARED_RATE_LIMIT_KEY: dhan:rate_limit:option_chain
      # Rails bridge (agent ADR-015): intake is opt-in and paper/sandbox only; the heartbeat is display-only.
      RAILS_INTENT_URL: ${OTA_RAILS_INTENT_URL:-}
      RAILS_INTENT_KEY: ${OTA_RAILS_INTENT_KEY:-}
      RAILS_INTENT_TRUSTED_HOSTS: asa-web
      AGENT_SNAPSHOT_ENABLED: "true"
      LIVE_TRADING_ACK: ${OTA_LIVE_ACK:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ota-journal:/app/data/journal
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      asa-web: { condition: service_healthy }
    # SIGTERM starts the agent's graceful shutdown, which waits for exits to complete.
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ota-journal:
