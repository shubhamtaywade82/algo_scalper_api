name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
      - "ccr-**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Real PostgreSQL and Redis, the same major versions the ledger and the rate gate are tested against.
    # The integration suite in tests/persistence.integration.test.ts runs only when these URLs are set.
    # The PostgreSQL password is derived from this run, and the service is reachable only on the runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgres://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres"
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (application and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
