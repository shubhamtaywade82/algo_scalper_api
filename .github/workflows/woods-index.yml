name: Woods Index

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Update Woods index
        run: bundle exec rake woods:incremental
        env:
          RAILS_ENV: development
