# Paper vs live: same strategy/guards; only execution differs (GatewayPaper vs GatewayLive).
# Effective mode is set by ENV LIVE_TRADING last-wins over YAML/DB: unset/false => paper (default for
# ./bin/dev). LIVE_TRADING=true => live broker path (real money risk — also set dhanhq.enable_orders).
paper_trading:
  enabled: true
  balance: 100000
  # Wallet realized PnL: cumulative = all-time paper exits (carry capital day to day).
  # daily = only exits on the current calendar day (legacy ₹1L + today's closes).
  realized_scope: cumulative

# Double-entry paper ledger (financial source of truth alongside position_trackers)
ledger:
  enabled: false          # when true, GatewayPaper wallet reads from ledger
  paper_enabled: false    # alias gate for paper wallet reads
  shadow_mode: true         # post journals + keep legacy wallet for drift checks
  block_negative_cash: true

# Realtime execution controls (tick-first architecture)
realtime:
  tick_first_enabled: true         # Evaluate exits from tick-driven Redis state first
  fallback_enabled: true           # Run interval scanners only when tick stream is stale
  tick_stale_after_seconds: 3      # Consider feed stale after this many seconds without tick-driven PnL event
  min_enforcement_gap_ms: 250      # Debounce full rule-chain evaluation per tracker in event-driven path
  db_sync_interval_seconds: 30      # Throttled DB sync cadence for active positions
  # Option legs often lag the index; REST snapshot is accepted when ticks are stale (see LtpResolutionGuard).
  entry_ltp_max_age_seconds: 10     # WebSocket tick must be at least this fresh when using cache path

# Trading time restrictions based on profitability analysis
# Use analyze_positions_by_time_intervals.rb to identify non-profitable periods
# Format: "HH:MM-HH:MM" (24-hour format, IST timezone)
# Example: ["10:30-11:30", "14:00-15:00"] blocks trading from 10:30 AM to 11:30 AM and 2:00 PM to 3:00 PM
trading_time_restrictions:
  enabled: false # Set to true to enable time-based restrictions
  avoid_periods: ["10:00-12:30"] # Block mid-morning churn session as per analysis
  block_exits: false # Set to true to block automated exits (SL/TP/Trailing) during blackout
  # Example based on analysis results:
  # avoid_periods:
  #   - "10:30-11:30"  # Morning non-profitable period
  #   - "14:00-15:00"  # Afternoon non-profitable period

midday_guard:
  enabled: true
  min_confidence: 0.7
  min_adx: 20
  block_after_time: "15:00"

loss_streak_guard:
  enabled: true
  consecutive_losses_threshold: 2
  cooldown_minutes: 30

sizing:
  post_1100_multiplier: 0.5

feature_flags:
  enable_direction_before_chain: true
  enable_trend_scorer: false # Toggle TrendScorer on/off (if false, uses legacy Supertrend+ADX path)
  enable_auto_subscribe_unsubscribe: true
  enable_demand_driven_services: true
  enable_underlying_aware_exits: false
  enable_peak_drawdown_activation: false
  auto_paper_on_insufficient_balance: false

# Calibration: historical option behaviour (weekly) and optional AI trade-based patches.
# Auto-apply merges proposed_patch into DB algo_config_document (same as POST …/apply).
calibration:
  auto_apply:
    # Master switch. When false, runs only create CalibrationRun rows for manual review.
    enabled: false
    # After WeeklyCalibrationJob (DhanHQ expired ATM±1 stats).
    historical_weekly: true
    # After AiCalibrationJob (paper-trade dataset + Ollama). Keep false until validated.
    ai_trades: false
    # Skip auto-apply when RegimeDetector flags a shift (volatile vs prior runs).
    reject_on_regime_shift: true
    # Only auto-apply while paper_trading.enabled (recommended before going live).
    require_paper_trading: true
    # Historical path: minimum weekly expiries present in DB (see raw_stats weeks_available).
    min_weeks_analyzed: 4
    # AI path: minimum paper trades in dataset_meta.total_trades.
    min_ai_trades: 15
    # Skip apply if this symbol had a successful apply within N days (0 = no cooldown).
    cooldown_days_between_applies: 7
    # Telegram: append skip reason to weekly calibration message; AI job sends a short follow-up.
    notify_on_skip: true

# DhanHQ broker settings
dhanhq:
  enable_orders: false # Set to true for live order submission (false = dry-run logging only)

# ============================================
# MARKET REGIME (India VIX)
# ============================================
market:
  vix_gate:
    enabled: true
    fail_closed_entries: true  # block entries until first successful evaluate!
    security_id: "21"       # India VIX (NSE IDX_I) — Dhan scrip master confirmed
    segment: IDX_I
    entry_ceiling: 20.0     # block new entries when VIX above this
    force_exit_above: 22.0  # force-exit all positions when VIX above this

# ============================================
# INDEX CONFIG (TREND-SCORE DRIVEN)
# Identity, lot, fno_segment, execution defaults: config/india_index_registry.yml
# ============================================
indices:
  - key: NIFTY
    capital_alloc_pct: 0.30
    max_same_side: 4 # AGGRESSIVE: Increased to 4 to allow multiple concurrent positions
    cooldown_sec: 10 # AGGRESSIVE: Reduced to 10 seconds for very frequent trades
    direction: bullish

    premium_band:
      min: 30
      max: 160 # raised from 120 — was blocking most real ATM premiums in current price regime

    otm_rules:
      max_otm: 2 # ATM → +1 OTM → +2 OTM

    risk_model:
      base_risk_pct: 0.01 # 1% base
      strong_trend_pct: 0.01
      weak_trend_pct: 0.005

    trade_limits:
      max_trades_per_day: 2

    # Per-index ADX thresholds (overrides global if specified)
    adx_thresholds:
      primary_min_strength: 8 # 1m ADX threshold (strict filter for options buying)
      confirmation_min_strength: 8 # 5m ADX threshold

    strategies:
      open_interest:
        enabled: true
        priority: 1
      momentum_buying:
        enabled: true
        priority: 2
        min_rsi: 60
      btst:
        enabled: true
        priority: 3
      swing_buying:
        enabled: true
        priority: 4

  - key: BANKNIFTY
    capital_alloc_pct: 0.30
    max_same_side: 4 # AGGRESSIVE: Increased to 4 to allow multiple concurrent positions
    cooldown_sec: 10 # AGGRESSIVE: Reduced to 10 seconds for very frequent trades
    direction: bullish

    premium_band:
      min: 60
      max: 650 # raised from 180 — BANKNIFTY ATM premiums were running 400-600, blocking nearly every signal

    otm_rules:
      max_otm: 2

    risk_model:
      base_risk_pct: 0.02 # 2% base
      strong_trend_pct: 0.02
      weak_trend_pct: 0.01

    trade_limits:
      max_trades_per_day: 20 # AGGRESSIVE: Increased to 20 trades per day

    # Per-index ADX thresholds (overrides global if specified)
    adx_thresholds:
      primary_min_strength: 8 # 1m ADX threshold (use global default)
      confirmation_min_strength: 8 # 5m ADX threshold (70% of typical ~44)

    strategies:
      open_interest:
        enabled: true
        priority: 1
      momentum_buying:
        enabled: true
        priority: 2
        min_rsi: 60
      btst:
        enabled: true
        priority: 3
      swing_buying:
        enabled: true
        priority: 4

  - key: SENSEX
    capital_alloc_pct: 0.30
    max_same_side: 4 # AGGRESSIVE: Increased to 4 to allow multiple concurrent positions
    cooldown_sec: 10 # AGGRESSIVE: Reduced to 10 seconds for very frequent trades
    direction: bullish

    premium_band:
      min: 40
      max: 320 # raised from 150 — SENSEX ATM premiums were running 180-300, blocking nearly every signal

    otm_rules:
      max_otm: 2

    risk_model:
      base_risk_pct: 0.02 # 2% base risk (increased to match BankNifty and increase pos size)
      strong_trend_pct: 0.02
      weak_trend_pct: 0.01

    trade_limits:
      max_trades_per_day: 20 # AGGRESSIVE: Increased to 20 trades per day

    # Per-index ADX thresholds (overrides global if specified)
    adx_thresholds:
      primary_min_strength: 15 # 1m ADX threshold (loosened to allow more SENSEX signals)
      confirmation_min_strength: 15 # 5m ADX threshold

    strategies:
      open_interest:
        enabled: true
        priority: 1
      momentum_buying:
        enabled: true
        priority: 2
        min_rsi: 60
      btst:
        enabled: true
        priority: 3
      swing_buying:
        enabled: true
        priority: 4

trade_limits:
  global_max_trades_per_day: 8

# ============================================
# BROKER FEES
# ============================================
# Broker fee configuration (₹20 per order execution, ₹40 per trade)
broker_fees:
  enabled: true # Set to false to disable fee calculations
  fee_per_order: 20 # Fee per order execution (entry or exit)
  # Total fee per trade = fee_per_order * 2 (entry + exit) = ₹40

# ============================================
# RISK MODEL (NEMESIS V3)
# ============================================
risk:
  sl_pct: 0.12 # -12% STOP LOSS
  tp_pct: 0.25 # +25% TAKE PROFIT
  per_trade_risk_pct: 0.15

  # --- New: Percentage-based PnL Exit ---
  percentage_pnl_exit:
    enabled: true
    target_pct: 15.0 # Full exit when total PnL reaches 15%

  # Underlying-context-aware trailing exit (tick-first path)
  # Tightens or forces trailing exit when underlying structure/trend signals reversal.
  # Only active when trailing is already armed (position profitable >= activation_pct).
  underlying_context_exit:
    enabled: true
    trend_score_threshold: 15     # trend_score below this = weak trend
    atr_ratio_threshold: 0.65     # atr_ratio below this AND falling = collapsing
    tightening_multiplier: 0.5    # compress allowed_dd by this factor when weakening

  # Hard rupee-based stops (HIGHEST PRIORITY - checked before %-based stops)
  # Perfect for scalping: fixed ₹1k SL + ₹2k TP per trade

  # Profit floor: once net PnL reaches lock_pct% of capital deployed, arms a TRAILING floor.
  # trail_pct: on each monitor cycle, floor = max(current_floor, hwm_pnl * trail_pct / 100).
  # lock_pct scales with position size — ₹2k on a ₹28k BN position is only 7%, vs 18% on a ₹11k SX position.
  profit_floor:
    enabled: true
    lock_pct: 10           # arm floor when net PnL >= 10% of capital_deployed (scales per position)
    trail_pct: 70          # ratchet floor to 70% of HWM each cycle
    breakeven_at: 200      # mark breakeven when net PnL reaches ₹200
    time_kill_minutes: 30  # give trailing more time to develop

  # RR-Based Profit Booking (Dynamic Exit)
  # Captures profits based on R multiples (Reward / Risk)
  rr_profit_booking:
    enabled: true
    target_rr: 2.5        # Exit fully at 2.5R (e.g., if SL is 10%, TP at 25%)

  # Exit-layer overrides (optional). Price-based structure invalidation uses these when set.
  exits:
    structure_invalidation:
      enabled: true           # Re-enabled with options-aware dual condition
      min_hold_seconds: 120   # No structure exit until position age >= this (reduces churn)
      buffer_pct: 0.004       # Legacy: require underlying to breach level by this fraction
      underlying_move_pct: 0.01  # Underlying must move 1%+ against trade direction
      premium_drop_pct: 0.05     # Premium must drop 5%+ from peak
    smc_navigator_exit:
      enabled: false           # opt-in: enforce Navigator exit signals (CHoCH, liquidity sweep)
      min_hold_seconds: 120    # no SMC navigator exit before position age >= this
      min_confidence: 0.65     # minimum Navigator exit confidence to trigger
    premium_momentum_failure:
      enabled: true
      default_stall_minutes: 2
      index_overrides:
        SENSEX:
          stall_minutes: 2
      session_overrides:
        chop_decay:
          stall_minutes_add: 0  # In chop, cut dead trades fast — no extension
        close_gamma:
          stall_minutes_add: 1

  # Time Stop: Prevents holding dead trades beyond time limits
  # Previously hardcoded in Risk::Rules::TimeStopRule — now runtime-configurable
  time_stop:
    enabled: true
    scalp:
      max_minutes: 15
      max_candles: 15
    trend:
      NIFTY: 45       # minutes
      BANKNIFTY: 45    # minutes
      SENSEX: 90       # minutes

  # Institutional Trailing System (3-Phase)
  # Calibrated from 16-week historical ATM intraday options data (DhanHQ)
  # Parameters derived from avg max gain, avg post-peak retracement, and session stats
  institutional_trailing:
    enabled: true
    session_aware: true           # Tighten trail distance in afternoon (0.75x after 13:00)
    expiry_day_tightening: 0.60   # 60% of normal trail on expiry day (Thursday)

    nifty:
      early_trigger: 0.05         # Phase 1: Survival (+5% profit → -12% SL)
      early_sl_offset: -0.12
      breakeven_trigger: 0.157    # Phase 2: Breakeven at +15.7% (25% of avg 62.88% max gain)
      activation_trigger: 0.20    # Phase 3: HWM Trailing at +20%
      trailing_distance: 0.386    # 38.6% from HWM (80% of avg 48.3% retrace)
    sensex:
      # SENSEX profile: CE avg max gain +30.47%, PE +69.07%, post-peak retrace ~99.8%
      # Options decay to near-zero after peak → activate early, lock in gains quickly
      early_trigger: 0.03         # Phase 1: Survival (+3% profit → -8% SL)
      early_sl_offset: -0.08
      breakeven_trigger: 0.08     # Phase 2: Breakeven at +8% (calibration: CE breakeven 7.6%)
      activation_trigger: 0.15    # Phase 3: HWM Trailing at +15% (between CE 7.6% and PE 17.3%)
      trailing_distance: 0.15     # 15% from HWM (wider than NIFTY — SENSEX moves are 2x larger)
      adaptive_drawdown:
        - { min_profit: 0.08, drawdown: 0.12 }  # At +8%: 12% drawdown room
        - { min_profit: 0.15, drawdown: 0.10 }  # At +15%: tighten to 10%
        - { min_profit: 0.30, drawdown: 0.08 }  # At +30% (avg CE peak): 8%
        - { min_profit: 0.50, drawdown: 0.06 }  # At +50% (deep PE zone): 6%
        - { min_profit: 0.75, drawdown: 0.04 }  # At +75%: tighten — gains can evaporate rapidly near expiry
        - { min_profit: 1.00, drawdown: 0.03 }  # At +100%: very tight — option likely near peak, protect aggressively
        - { min_profit: 1.50, drawdown: 0.02 }  # At +150%+: near-expiry gamma extreme — lock in immediately on any retreat
    banknifty:
      early_trigger: 0.06         # Phase 1: Survival (+6% profit → -15% SL)
      early_sl_offset: -0.15      # Wider SL — BN is more volatile
      breakeven_trigger: 0.18     # Phase 2: Breakeven at +18%
      activation_trigger: 0.25    # Phase 3: HWM Trailing at +25%
      trailing_distance: 0.35     # 35% from HWM (conservative — last-week-only trades)


  # Dynamic Trailing stops
  trailing:
    enabled: true
    activation_pct: 3.5    # Lower activation for more aggressive trailing
    drawdown_pct: 2.5      # Tighter drawdown to capture move

  trailing_mode: 'direct' # Moving up only to capture profits
  direct_trailing:
    enabled: true
    distance_pct: 3.0 # Trail at 3% distance from peak
    activation_profit_pct: 5.0 # Start direct trailing at 5% profit
    min_sl_offset_pct: 0.0 # Never let SL go below breakeven once direct trailing starts

  # Post-Profit Zone Management (State Machine)
  # Implements sophisticated profit zone management after ₹2k TP
  # Core Principle: ₹2k TP is a minimum extraction, not a cap
  # After ₹2k, trade continues ONLY if underlying trend + option momentum are favorable
  #
  # State Machine:
  # - ENTRY: ₹0 → ₹2,000 (normal trade management, Hard SL: -₹1,000)
  # - SECURED_PROFIT_ZONE: ₹2,000 → ₹4,000 (capital protection mode, SL moved to green)
  # - RUNNER_ZONE: ₹4,000+ (trailing stop with exponential drawdown)
  #
  # At ₹2k transition:
  # - SL moves to +₹500 to +₹1,000 (locked profit)
  # - Disable loose % drawdown logic
  # - Switch to underlying-aware exit
  #
  # Hold criteria after ₹2k (ALL must be TRUE):
  # Underlying:
  #   - 1m Supertrend still in direction
  #   - ADX ≥ 18 and not falling
  #   - Candle bodies > wicks (no exhaustion)
  #   - No HTF resistance within 30-40 pts
  # Option:
  #   - Premium is NOT stalling
  #   - LTP continues to make HH (higher highs)
  #   - Pullbacks < 30-35% of last impulse
  #   - Bid-ask spread stable
  #
  # Exit immediately if ANY criteria fails
  post_profit_zone:
    enabled: true # Set to true to enable post-profit zone management
    secured_profit_threshold_rupees: 2000 # Transition to secured profit zone at ₹2k
    runner_zone_threshold_rupees: 4000 # Transition to runner zone at ₹4k
    secured_sl_rupees: 800 # Move SL to +₹800 when entering secured profit zone (green SL)
    underlying_adx_min: 18.0 # Minimum ADX for underlying trend to be considered favorable
    option_pullback_max_pct: 35.0 # Maximum pullback % from peak before considering momentum stalled
    underlying_atr_collapse_threshold: 0.65 # ATR ratio threshold for collapse detection
    runner_zone_momentum_check: false # Enable additional momentum checks in runner zone (optional)

  # Time-Regime Based Rules (Session-Aware Greeks)
  # Implements time-conditioned rule system that respects Greek dominance across market sessions
  # Core Principle: Options buying is NOT symmetric across the day - same signal behaves differently
  # by time due to changing Greek dominance (Delta/Gamma in open, Theta in mid-day, IV crush in close)
  #
  # IMPORTANT: All times are in IST (Indian Standard Time, UTC+5:30)
  # Rails timezone is configured as "Asia/Kolkata" in config/application.rb
  #
  # Market Session Segmentation (Indian Indices - IST):
  # S1: OPEN EXPANSION     → 09:15 – 09:45 IST (Delta + Gamma dominant - fast moves, fake breakouts)
  # S2: TREND CONTINUATION → 09:45 – 11:30 IST (Best zone - Delta stable, Theta low, IV steady)
  # S3: CHOP / DECAY       → 11:30 – 13:45 IST (Theta dominant - danger zone, mostly no trade)
  # S4: CLOSE / GAMMA      → 13:45 – 15:15 IST (Theta + IV crush - tight rules, no runners)
  #
  # Each regime gets different SL/TP/trailing rules based on Greek behavior
  time_regimes:
    enabled: true # Time-regime rules active — TP/SL adjust by market session

    # S1: OPEN EXPANSION (09:15 – 09:45)
    # Delta explodes, Gamma spikes, IV expands, Theta irrelevant
    # Premium moves FAST, small index move → big option move, fake breakouts common
    open_expansion:
      start: "09:15"
      end: "09:45"
      sl_multiplier: 1.0 # Standard SL (SENSEX: ₹15-20, NIFTY: ₹8-12)
      tp_multiplier: 1.0 # Fast TP (₹2k often hits in 1-3 candles)
      allow_trailing: false # No micro trailing (gets wicked out)
      allow_runners: false # No runners (enter fast, exit fast, no greed)
      allow_entries: true
      min_adx: 20.0 # Strict entry (ADX ≥ 20, ATM only, first breakout/pullback only)
      max_tp_rupees: 2000 # Hard ₹2k TP, no more

    # S2: TREND CONTINUATION (09:45 – 11:30) ✅ BEST ZONE
    # Delta stable, Gamma moderate, Theta low, IV steady
    # This is THE MONEY ZONE - extract base profit, then let winners breathe
    trend_continuation:
      start: "09:45"
      end: "11:30"
      sl_multiplier: 1.0 # Moderate SL (SENSEX: ₹10-15, NIFTY: ₹6-10)
      tp_multiplier: 1.0 # First extraction: ₹2k, then runner allowed
      allow_trailing: true # Enable post-TP logic, move SL to green after ₹2k
      allow_runners: true # Allow runner with trend intact (exponential drawdown logic fits here)
      allow_entries: true
      min_adx: 15.0 # Trend continuation only, pullbacks preferred, 1m + 5m alignment
      max_adx: 35.0 # Ceiling, not just floor — very high ADX was the single worst bucket here
                    # in regime research (late/exhaustion moves). NIFTY/SENSEX statistically
                    # indistinguishable from each other at current sample size — kept shared.
      # BANKNIFTY measured meaningfully different optimal cutoffs in a follow-up finer-grained
      # pass (fav:adverse ratio bottomed at ADX 15-20 and collapsed again at ADX>=40, better
      # in between) — given its own thresholds rather than forced to share NIFTY/SENSEX's.
      per_index_min_adx:
        BANKNIFTY: 20.0
      per_index_max_adx:
        BANKNIFTY: 40.0
      max_tp_rupees: null # No limit (runners allowed)

    # S3: CHOP / THETA ZONE (11:30 – 13:45) ❌ DANGER
    # Delta weak, Gamma flat, Theta dominant, IV bleeds
    # This is where most retail losses happen - survive, don't trade
    chop_decay:
      start: "11:30"
      end: "13:45"
      sl_multiplier: 1.0 # Restore room to breathe
      tp_multiplier: 0.8 # SMALL TP
      allow_trailing: false # Disable trailing
      allow_runners: false # No runners allowed
      allow_entries: false # Disable normal entries (allow ONLY if ADX ≥ 22, expansion present, Sensex > 60 pts)
      min_adx: 22.0 # Very strict if entries allowed
      max_tp_rupees: 1500 # Small TP, no runners

    # S4: CLOSE / GAMMA ZONE (13:45 – 15:15)
    # Theta accelerates, Gamma spikes near ATM, IV crush common, reversals violent
    # Take what market gives, don't argue - scalp only, no greed
    close_gamma:
      start: "13:45"
      end: "15:15"
      sl_multiplier: 1.0 # Restore room to breathe
      tp_multiplier: 0.75 # FIXED TP (₹1.5k-₹2k)
      allow_trailing: true # Regime research: close_gamma outperformed trend_continuation's
                           # favorable-continuation rate in every matched ADX bucket (up to
                           # 13:1 favorable:adverse for BANKNIFTY at ADX 35+) — don't cut
                           # winners short here on an outdated "risky window" assumption
      allow_runners: true # See allow_trailing note above — data says let winners run here too
      allow_entries: true # ONLY continuation moves, no fresh breakouts after 14:45, ATM only
      min_adx: 18.0
      # Follow-up finer-grained pass found ADX>=40 clearly worst for BANKNIFTY here too, so
      # giving it a ceiling (this pass used a different Supertrend/ADX reconstruction than the
      # one that produced the "13:1 at ADX 35+" note above — the two aren't fully reconciled,
      # so this is a conservative ceiling above where both passes agree things degrade, not a
      # tight one).
      per_index_max_adx:
        BANKNIFTY: 40.0
      max_tp_rupees: 2000 # Fixed ₹1.5k-₹2k

  # Global Time-Based Overrides (CRITICAL - override everything)
  # All times are in IST (Indian Standard Time, UTC+5:30)
  time_overrides:
    # Override 1: No new trades after 14:50 IST (unless exceptional conditions)
    no_new_trades_after: "14:50" # No new trades after this time IST (unless ADX ≥ 25, massive expansion)

    # Override 2: IV collapse detection
    iv_collapse:
      enabled: false # Set to true when IV data is available
      collapse_threshold: 0.15 # Exit if IV drops >15% suddenly (time irrelevant)

    # Override 3: Price stall detection (especially after ₹2k profit)
    stall_detection:
      enabled: true # Exit if price stalls for N candles (no new HH/LL)
      stall_candles: 3 # Number of candles with no progress before exit
      min_profit_rupees: 2000 # Only check stall if profit >= this amount

# ============================================
# POSITION SIZING (RUPEES-BASED)
# ============================================
# Rupee-based position sizing: derive quantity from fixed ₹ risk
# Formula: quantity = floor(risk_rupees / (stop_distance_rupees × lot_size)) × lot_size
# This ensures position size is calculated to match exact ₹ risk, not percentages
position_sizing:
  enabled: true # Set to true to enable rupee-based position sizing
  mode: rupee_based # Options: 'rupee_based' or 'percentage_based' (legacy)

  # Rupee-based sizing parameters (used when enabled: true)
  risk_rupees: 5000 # Fixed risk per trade in rupees
  target_rupees: 15000 # Target profit per trade in rupees (for R:R calculation)
  stop_distance_rupees: 50 # Stop distance in rupees (updated for increased sizing)

  # Index-specific stop distances (override global if specified)
  index_stop_distances:
    NIFTY: 8 # Typical stop distance for NIFTY options
    BANKNIFTY: 12 # Typical stop distance for BANKNIFTY options
    SENSEX: 15 # Typical stop distance for SENSEX options

  # Bidirectional trailing stops (enhanced with adaptive drawdown schedule)
  trail_step_pct: 0.03 # 3% trailing step (for breakeven calculation)
  breakeven_after_gain: 0.05 # Lock breakeven at +5% profit
  exit_drop_pct: 0.03 # Fixed trailing threshold (fallback, adaptive schedule takes precedence)
  min_profit_rupees: 0 # allow immediate TP exits

  # Trailing stop mode: 'tiered' (fixed tiers) or 'direct' (follows price directly)
  trailing_mode: direct # Options: 'tiered' or 'direct'

  # Direct trailing stop configuration (when trailing_mode: 'direct')
  # SL moves directly with price, maintaining fixed distance below current price
  # Only moves upward - never moves down
  direct_trailing:
    enabled: true # Enable direct trailing stop
    distance_pct: 5.0 # Distance below current price (e.g., 5% = SL at 95% of current price)
    activation_profit_pct: 0.0 # Minimum profit % before activating (0 = immediate activation)
    min_sl_offset_pct: -30.0 # Minimum SL offset from entry (prevents SL from going below initial SL)

  # Profit protection: Hard stop if HWM reaches threshold and drops by percentage
  profit_protection:
    hwm_threshold_rupees: 1040.0 # Exit if HWM reaches this amount
    drop_pct_from_hwm: 1.0 # Exit if current PnL drops this % from HWM
    enabled: true

  # Upward exponential drawdown (activated when pnl >= activation_profit_pct)
  drawdown:
    activation_profit_pct: 3.0
    profit_min: 3.0
    profit_max: 30.0
    dd_start_pct: 15.0 # start allowed DD at this % when profit == profit_min
    dd_end_pct: 1.0 # floor allowed DD at this % when profit >= profit_max
    exponential_k: 3.0 # curve steepness
    index_floors:
      NIFTY: 1.0
      BANKNIFTY: 1.2
      SENSEX: 1.5

  # Reverse (below entry) dynamic loss tightening
  reverse_loss:
    enabled: true
    max_loss_pct: 20.0 # starting allowed loss when position just turned red
    min_loss_pct: 5.0 # tightest allowed loss when pnl hits -30%
    loss_span_pct: 30.0 # map -0..-loss_span_pct to max_loss_pct..min_loss_pct
    time_tighten_per_min: 2.0 # % tightening per minute spent below entry
    atr_penalty_thresholds:
      - { threshold: 0.75, penalty_pct: 3.0 }
      - { threshold: 0.60, penalty_pct: 5.0 }

  # Early Trend Failure Exit (ETF)
  etf:
    enabled: true
    activation_profit_pct: 7.0 # ETF checks apply until trailing activates
    trend_score_drop_pct: 30.0 # drop from peak trend score to trigger ETF
    adx_collapse_threshold: 10 # ADX under this triggers ETF
    atr_ratio_threshold: 0.55 # collapse detection
    confirmation_ticks: 2 # consecutive tick confirmations

  # Micro-Trailing model (tiered) - 3% INTERVALS with CONSERVATIVE SL offsets
  # More granular tiers with tighter protection to minimize losses
  # Used when trailing_mode: 'tiered'
  trailing_tiers:
    - { trigger_pct: 3, sl_offset_pct: -15 } # 3%: -15% SL (wide stop, early stage)
    - { trigger_pct: 6, sl_offset_pct: -10 } # 6%: -10% SL (gradual tightening)
    - { trigger_pct: 9, sl_offset_pct: -5 } # 9%: -5% SL (approaching breakeven)
    - { trigger_pct: 12, sl_offset_pct: -2 } # 12%: -2% SL (close to breakeven)
    - { trigger_pct: 15, sl_offset_pct: 0 } # 15%: 0% SL (breakeven locked)
    - { trigger_pct: 18, sl_offset_pct: 2 } # 18%: +2% SL (small profit protection)
    - { trigger_pct: 21, sl_offset_pct: 3 } # 21%: +3% SL (tighter than old +5%)
    - { trigger_pct: 24, sl_offset_pct: 4 } # 24%: +4% SL (gradual increase)
    - { trigger_pct: 27, sl_offset_pct: 5 } # 27%: +5% SL (conservative)
    - { trigger_pct: 30, sl_offset_pct: 6 } # 30%: +6% SL
    - { trigger_pct: 33, sl_offset_pct: 8 } # 33%: +8% SL
    - { trigger_pct: 36, sl_offset_pct: 10 } # 36%: +10% SL
    - { trigger_pct: 39, sl_offset_pct: 12 } # 39%: +12% SL
    - { trigger_pct: 42, sl_offset_pct: 15 } # 42%: +15% SL
    - { trigger_pct: 45, sl_offset_pct: 18 } # 45%: +18% SL
    - { trigger_pct: 48, sl_offset_pct: 20 } # 48%: +20% SL
    - { trigger_pct: 51, sl_offset_pct: 22 } # 51%: +22% SL
    - { trigger_pct: 54, sl_offset_pct: 25 } # 54%: +25% SL
    - { trigger_pct: 57, sl_offset_pct: 28 } # 57%: +28% SL
    - { trigger_pct: 60, sl_offset_pct: 30 } # 60%: +30% SL
    - { trigger_pct: 63, sl_offset_pct: 32 } # 63%: +32% SL
    - { trigger_pct: 66, sl_offset_pct: 35 } # 66%: +35% SL
    - { trigger_pct: 69, sl_offset_pct: 38 } # 69%: +38% SL
    - { trigger_pct: 72, sl_offset_pct: 40 } # 72%: +40% SL
    - { trigger_pct: 75, sl_offset_pct: 42 } # 75%: +42% SL
    - { trigger_pct: 78, sl_offset_pct: 45 } # 78%: +45% SL
    - { trigger_pct: 81, sl_offset_pct: 48 } # 81%: +48% SL
    - { trigger_pct: 84, sl_offset_pct: 50 } # 84%: +50% SL
    - { trigger_pct: 87, sl_offset_pct: 52 } # 87%: +52% SL
    - { trigger_pct: 90, sl_offset_pct: 55 } # 90%: +55% SL
    - { trigger_pct: 93, sl_offset_pct: 58 } # 93%: +58% SL
    - { trigger_pct: 96, sl_offset_pct: 60 } # 96%: +60% SL
    - { trigger_pct: 99, sl_offset_pct: 62 } # 99%: +62% SL
    - { trigger_pct: 102, sl_offset_pct: 65 } # 102%: +65% SL
    - { trigger_pct: 105, sl_offset_pct: 68 } # 105%: +68% SL
    - { trigger_pct: 108, sl_offset_pct: 70 } # 108%: +70% SL
    - { trigger_pct: 111, sl_offset_pct: 72 } # 111%: +72% SL
    - { trigger_pct: 114, sl_offset_pct: 75 } # 114%: +75% SL
    - { trigger_pct: 117, sl_offset_pct: 78 } # 117%: +78% SL
    - { trigger_pct: 120, sl_offset_pct: 80 } # 120%: +80% SL

  # Peak drawdown protection - AGGRESSIVE TIERED PROTECTION
  # Higher peaks get progressively tighter drawdown thresholds to preserve profits
  peak_drawdown_exit_pct: 3 # Base threshold (fallback for very low peaks)
  # Tiered drawdown thresholds based on peak profit percentage
  # Higher peaks = tighter protection to prevent losing large profits
  tiered_drawdown_thresholds:
    very_low: 0.03 # 3% - Peak 0-5%: 3% drawdown allowed
    low: 0.025 # 2.5% - Peak 5-10%: 2.5% drawdown allowed
    medium: 0.02 # 2% - Peak 10-15%: 2% drawdown allowed
    medium_high: 0.015 # 1.5% - Peak 15-20%: 1.5% drawdown allowed
    high: 0.012 # 1.2% - Peak 20-25%: 1.2% drawdown allowed
    very_high: 0.01 # 1% - Peak 25-30%: 1% drawdown allowed
    ultra_high: 0.008 # 0.8% - Peak >30%: 0.8% drawdown allowed (maximum protection)
  peak_drawdown_activation_profit_pct: 0.05 # 5% - activate peak drawdown earlier
  peak_drawdown_activation_sl_offset_pct: 0.03 # 3% - activate with modest SL offset

  # Trailing activation: Configurable percentage-based activation threshold
  # Trailing rules (TrailingStopRule, PeakDrawdownRule) only activate when pnl_pct >= this value
  # Based on buy value (premium × lot_size × lots), works across any capital/allocation/lot size
  # Examples: 6.0, 6.66, 9.99, 10.0, 13.32, 15.0, 20.0
  trailing:
    enabled: true # Global trailing toggle (used by dashboard)
    activation_pct: 10.0 # Activate trailing when profit >= 10% of buy value (configurable: 6%, 6.66%, 13.32%, etc.)
    drawdown_pct: 3.0 # Exit if price drops this % from peak (used by trailing rules)

  # Secure profit rule: Lock in profits above threshold while allowing positions to ride
  secure_profit_threshold_rupees: 600 # Activate tighter protection when profit >= ₹600
  secure_profit_drawdown_pct: 0.025 # 2.5% drawdown from peak when secured

  # Underlying-aware exit thresholds
  underlying_trend_score_threshold: 10.0 # Exit if underlying trend_score < this value
  underlying_atr_collapse_multiplier: 0.65 # Exit if ATR ratio < this value (falling volatility)
  use_smc_bias_flip: false               # opt-in: exit when SMC bias flips against position direction
  smc_bias_flip_trend_threshold: 40      # only exit on bias flip when trend_score is also below this

  daily_limits:
    enable: true
    per_index:
      NIFTY: 0.03 # 3% max loss for NIFTY (increased from 2%)
      BANKNIFTY: 0.05 # 5% max loss for BANKNIFTY (increased from 4%)
      SENSEX: 0.03 # 3% max loss for SENSEX (increased from 2%)
    global_limit_pct: 0.06 # 6% (increased from 5%)
    # Sanity cap on trade *count* per index per day, independent of the loss-pct caps above.
    # 1m strategies (e.g. supertrend_v1) can legitimately re-signal many times a session —
    # this was hardcoded to 6 and was blocking real, profitable trend entries after only a
    # handful of trades. Raise per-index as warranted; `default` covers any index not listed.
    max_trades_per_symbol:
      default: 15
      per_index:
        NIFTY: 25
        BANKNIFTY: 20
        SENSEX: 20

  # Daily profit target: Stop trading when daily profit reaches this amount
  max_daily_profit: 20000 # ₹20,000 daily profit target (trading stops when reached)
  # Alternative config key: daily_profit_target (also supported)

  # Edge Failure Detector (Quality/Regime Detector - NOT a loss cap)
  # Detects when trading edge has degraded and pauses entries to prevent death by a thousand cuts
  # This preserves profit-hunting mode while preventing edge decay days
  #
  # Philosophy:
  # - Unlimited trades and losses allowed UNTIL ₹20k profit
  # - BUT edge degradation must be detected and paused
  # - Prevents chop/theta bleed days from causing infinite drawdown
  #
  # Detection Methods:
  # 1. Rolling PnL Window: Last N trades net PnL <= threshold → pause entries
  # 2. Consecutive SLs: N consecutive stop losses → pause entries
  # 3. Session-based: Disable entries in S3 (chop/decay) after consecutive SLs
  edge_failure_detector:
    enabled: true # Set to true to enable edge failure detection

    # Rolling PnL Window Breaker
    # Tracks last N trades and pauses if net PnL falls below threshold
    # This detects chop days and signal degradation without relying on daily loss caps
    rolling_window_size: 5 # Number of recent trades to evaluate
    rolling_window_threshold_rupees: -3000 # Pause if last N trades net PnL <= -₹3k
    pause_duration_minutes: 60 # Pause entries for N minutes when threshold breached

    # Consecutive SL Breaker
    # Pauses entries after N consecutive stop losses
    # Detects when market regime is unfavorable (chop, fake breakouts)
    max_consecutive_sls: 2 # Pause after N consecutive SLs
    consecutive_sl_pause_minutes: 60 # Pause entries for N minutes after consecutive SLs

    # Session-Based Pause (especially S3 - chop/decay zone)
    # In dangerous sessions, disable entries after consecutive SLs
    session_based_pause: false # Enable session-aware pause logic
    s3_max_consecutive_sls: 2 # In S3 (11:30-13:45), pause after N consecutive SLs
    s4_start_time: "13:45" # Resume entries when S4 (close/gamma) starts (IST)

# ============================================
# PORTFOLIO-LEVEL PROFIT LOCK ENGINE
# ============================================
# Protects accumulated intraday gains using a monotonic profit floor.
# Once net PnL crosses a milestone, a floor is locked in at peak_pnl × lock_ratio.
# If net PnL ever drops below the floor → ALL positions exit + new entries blocked.
#
# Floor is monotonic: it only moves up as PnL peaks climb.
# Example: PnL peaks at ₹40k (past the ₹35k trigger, level 2 ratio):
#   floor = ₹40k × 0.70 = ₹28k
#
# Set enabled: false to disable the entire engine without removing config.
profit_lock:
  enabled: true
  levels:
    - trigger: 20000   # ₹20k — Level 1
      lock_ratio: 0.60 # floor = peak_pnl × 60%  (e.g. ₹20k peak → ₹12k floor)
    - trigger: 35000   # ₹35k — Level 2
      lock_ratio: 0.70 # floor = peak_pnl × 70%  (e.g. ₹35k peak → ₹24.5k floor)
    - trigger: 50000   # ₹50k — Level 3
      lock_ratio: 0.73 # floor = peak_pnl × 73%  (e.g. ₹50k peak → ₹36.5k floor)

# ============================================
# MARKET CONTEXT (regime snapshot + permission gate)
# ============================================
# Composes structure/volatility/participation with MarketRegimeDetector. When gate.enabled
# is true, entries are blocked unless regime + chain signals pass thresholds.
market_context:
  enabled: false
  regime_scoring:
    weights:
      trending_structure: 20
      displacement: 20
      vwap_not_chop: 15
      strong_strength: 15
      volatility_ok: 10
      participation_high: 10
      legacy_confidence: 10
  chain_signal_extractor:
    premium_move_pct_threshold: 3.0
    near_expiry_penalty_days: 1
  gate:
    enabled: false
    min_conviction_score: 70
    min_chain_confidence: 40
    allow_normal_participation: true
    require_premium_expansion: false
    require_smc_alignment: false   # opt-in: reject if SMC bias conflicts with final_direction
  strategy_profiles:
    aggressive_min_score: 80
    controlled_min_score: 60

# ============================================
# SIGNAL SETTINGS
# ============================================
signals:
  # exploratory = most permissive (research/paper). standard = use algo.yml as written (no tier overlay).
  # selective = strict gates + higher quality bar (not a profit guarantee). Override: SIGNAL_TIER env.
  # See config/signal_tier_presets.yml
  signal_tier: exploratory

  # Entry strategy selection (code enforces behavior; no strategy logic in YAML)
  # primary: supertrend => Supertrend flip only; omit or use other value for legacy multi-indicator path
  entry_strategy:
    primary: supertrend

  primary_timeframe: "1m"
  confirmation_timeframe: "5m"

  # Expiry date filtering: Skip indices with expiry > max_expiry_days
  # This prevents trading in indices where expiry is too far away (e.g., monthly BANKNIFTY when > 7 days)
  max_expiry_days: 7 # Maximum days to expiry (indices with expiry > this will be skipped)

  # Index Technical Analysis (TA) Configuration
  # Multi-timeframe technical analysis before signal generation
  # Uses DhanHQ TA modules if available, falls back to existing indicator infrastructure
  enable_index_ta: false # Enable index TA step (default: true)
  ta_timeframes: [5, 15, 60] # Timeframes in minutes for TA analysis (default: [5, 15, 60])
  ta_days_back: 30 # Days of historical data to fetch (default: 30)
  ta_min_confidence: 0.6 # Minimum confidence (0.0-1.0) required to proceed (default: 0.6)
  # If TA signal is neutral or confidence < ta_min_confidence, signal generation is skipped

  # NoTradeEngine Configuration
  # Set to false to disable both Phase 1 (pre-check) and Phase 2 (detailed validation)
  # Useful for testing the trading system without NoTradeEngine restrictions
  enable_no_trade_engine: false # Enable NoTradeEngine validation (default: true)

  # SMC + AVRZ Permission System Configuration
  # Set enable_smc_avrz_permission: false to completely disable SMC+AVRZ permission checks
  # When disabled, system uses only Supertrend + ADX for signal generation (traditional approach)
  # Permission will always return :scale_ready (allows trading) when disabled
  # This also disables SMC decision alignment checks
  enable_smc_avrz_permission: false # Set to false to disable SMC+AVRZ checks (default: true)

  # SMC Decision Alignment (only used if enable_smc_avrz_permission is true)
  # When enabled, requires SMC decision (call/put) to align with signal direction
  # Set to false to disable SMC decision alignment check (but keep permission checks)
  enable_smc_decision_alignment: true # Set to false to disable SMC decision alignment (default: true)

  # SMC EventStore: persist every scan decision to smc_events for audit/replay
  smc_event_store_publish: true

  # SMC Navigator overlay (LTF tactical gate; additive to PermissionResolver — not a replacement)
  enable_smc_navigator_overlay: false
  smc_navigator_min_confidence: 0.6
  smc_navigator_exit_advisory: true

  # DirectionGate Configuration
  # DirectionGate blocks trades that go against the market regime:
  # - Blocks PE trades in bullish regime
  # - Blocks CE trades in bearish regime
  # - Blocks all trades in neutral regime
  # Set to false to disable DirectionGate and allow all signal directions
  enable_direction_gate: true # Enabled to block trades in CHOPPY/RANGING markets

  # Permission mode (only used if enable_smc_avrz_permission is true)
  # Controls how strict the permission resolver is for allowing trades
  # Options:
  #   - strict: Full validation (default) - maximum capital protection
  #   - lenient: Relaxed validation - allows trades in range markets without displacement, trend markets without BOS
  #   - bypass: Completely bypasses SMC+AVRZ checks - always returns execution_only (testing only!)
  # See docs/PERMISSION_SYSTEM_CONFIGURATION.md for details
  permission_mode: lenient # Options: strict, lenient, bypass (default: strict)

  # Trading context gate: regime score, stability, and :chop blocking (see Domain::TradingContext).
  # strict: production defaults; relaxed: allow signals on expiry/chop/low score (temporary / paper).
  enable_trading_context_gate: true
  trading_context_strictness: relaxed # strict | relaxed

  # Option pick must show favorable premium change vs prev_close (Signal::MomentumValidator).
  enable_option_premium_momentum_gate: false

  # After strike selection: PropStrike-style score floor (see option_chain.min_strike_score).
  enable_strike_score_floor_gate: false

  # After strike selection: expected-move vs premium hard check (ExpectedMoveValidator).
  enable_expected_move_strike_gate: false

  # Supertrend+ADX Strategy Configuration
  # By default: 1m Supertrend signal is enabled (no config needed)
  # ADX filter and 5m confirmation are toggleable
  enable_supertrend_signal: true # Enable 1m Supertrend signal (default: true)
  enable_adx_filter: true # Enabled to block weak trends (win rate 16.7% for ADX < 15)
  enable_confirmation_timeframe: false # Enable 5m HTF confirmation (default: false)

  # Optimized Parameters Configuration
  # Set to false to disable loading optimized indicator parameters from BestIndicatorParam
  # When disabled, uses hardcoded defaults from config/algo.yml (supertrend.period, supertrend.base_multiplier, etc.)
  # When enabled (default: true), automatically loads best-scoring parameters from optimization runs
  use_optimized_params: true # Enable optimized parameters from BestIndicatorParam (default: true)

  # Modular Indicator System Configuration
  # Use multi_indicator_strategy: true to enable modular indicator system
  # When enabled, the 'indicators' list defines which indicators to use
  use_multi_indicator_strategy: false # Set to true to use modular system

  # Indicator threshold preset: loose, moderate, tight, production
  # - loose: Very permissive - generates more signals for initial testing
  # - moderate: Balanced - good starting point
  # - tight: Strict - fewer but higher quality signals
  # - production: Optimized based on backtesting results
  # Can also be set via ENV['INDICATOR_PRESET']
  indicator_preset: loose # Options: loose, moderate, tight, production

  confirmation_mode: all # Options: all, majority, weighted, any
  min_confidence: 60 # Minimum combined confidence score (0-100)
  # Note: If indicator_preset is set, these may be overridden by preset values

  # Indicator configurations for modular system
  # Each indicator can be enabled/disabled and configured independently
  indicators:
    - type: supertrend
      enabled: true
      config:
        period: 7
        multiplier: 3.0
        trading_hours_filter: true

    - type: adx
      enabled: true
      config:
        period: 14
        min_strength: 15
        trading_hours_filter: true

    # Example: Add RSI indicator (disabled by default)
    # - type: rsi
    #   enabled: false
    #   config:
    #     period: 14
    #     oversold: 30
    #     overbought: 70
    #     trading_hours_filter: true

    # Example: Add MACD indicator (disabled by default)
    # - type: macd
    #   enabled: false
    #   config:
    #     fast_period: 12
    #     slow_period: 26
    #     signal_period: 9
    #     trading_hours_filter: true

    # Trend Duration Indicator (disabled by default)
    # Uses HMA to detect trend direction and forecast probable trend duration
    # - type: trend_duration
    #   enabled: false
    #   config:
    #     hma_length: 20        # HMA period
    #     trend_length: 5       # Bars to confirm trend (rising/falling)
    #     samples: 10           # Number of historical durations to track
    #     trading_hours_filter: true

  trend_scorer:
    min_trend_score: 14
    mtf_enabled: true

  # Presets for comprehensive_validation + options IV/theta thresholds (via effective_validation_mode).
  validation_modes:
    conservative:
      adx_min_strength: 25
      adx_confirmation_min_strength: 30
      iv_rank_max: 0.6
      iv_rank_min: 0.15
      theta_risk_cutoff_hour: 14
      theta_risk_cutoff_minute: 0
      require_trend_confirmation: true
      require_iv_rank_check: true
      require_theta_risk_check: true
    balanced:
      adx_min_strength: 18
      adx_confirmation_min_strength: 20
      iv_rank_max: 0.8
      iv_rank_min: 0.1
      theta_risk_cutoff_hour: 14
      theta_risk_cutoff_minute: 30
      require_trend_confirmation: true
      require_iv_rank_check: true
      require_theta_risk_check: true
    aggressive:
      adx_min_strength: 15
      adx_confirmation_min_strength: 18
      iv_rank_max: 0.9
      iv_rank_min: 0.05
      theta_risk_cutoff_hour: 15
      theta_risk_cutoff_minute: 0
      require_trend_confirmation: false
      require_iv_rank_check: true
      require_theta_risk_check: false

  validation_mode: balanced

  # When enabled, failed IV-rank / theta checks from options analysis block strike pick + entry.
  # IV rank here is still the index candle volatility proxy (not option IV percentile).
  options_analysis_gate:
    enabled: false
    block_on_iv_rank_failure: true
    block_on_theta_risk_failure: true

  # When true, comprehensive_validation failure stops the pipeline before context/quality gates.
  halt_on_validation_failure: false

  # Block new signals when nearest series expiry is too soon (0 = expiry day, 1 = tomorrow, etc.).
  entry_dte_guard:
    enabled: true
    reject_when_days_to_expiry_lte: 0

  supertrend:
    period: 10
    base_multiplier: 1.5

  adx:
    # Global ADX thresholds (used as fallback if per-index thresholds not specified)
    min_strength: 15 # ADX threshold for 1m timeframe (Loss Avoidance floor)
    confirmation_min_strength: 15 # ADX threshold for 5m confirmation (Loss Avoidance floor)
    # Note: Per-index thresholds in indices[].adx_thresholds override these values

# ============================================
# OPTION CHAIN SETTINGS
# ============================================
chain_analyzer:
  max_candidates: 2
  strike_distance_pct: 0.02
  min_oi: 10000
  min_iv: 5.0
  max_iv: 60.0
  max_spread_pct: 0.03

  scoring_weights:
    oi: 0.4
    spread: 0.25
    iv: 0.2
    volume: 0.15

option_chain:
  min_iv: 5.0          # Relaxed from 10 — LOW_VOL regime options often have IV < 10
  max_iv: 60
  min_oi: 50000
  max_spread_pct: 3.0
  min_strike_score: 80.0  # PropStrikeSelector scores 0–1 (×100 = 0–100); 140 default was unreachable

data_freshness:
  disable_ohlc_caching: false
  disable_option_chain_caching: false
  ohlc_cache_duration_minutes: 5
  option_chain_cache_duration_minutes: 2

# ============================================
# WEBSOCKET WATCHLIST
# ============================================
# WebSocket watchlist for market feed subscription
# Format: Array of strings "SEGMENT:SECURITY_ID" or empty array []
# Example: ["NSE_EQ:11536", "NSE_EQ:11536"]
# Can also be set via ENV['DHANHQ_WS_WATCHLIST'] as fallback
watchlist:
  - segment: IDX_I
    security_id: "21"   # India VIX — keeps TickCache warm for VixGate

# ============================================
# TELEGRAM NOTIFICATIONS
# ============================================
telegram:
  enabled: true # Set to false to disable Telegram notifications
  # Bot token and chat ID should be set via environment variables:
  # TELEGRAM_BOT_TOKEN - Your Telegram bot token from @BotFather
  # TELEGRAM_CHAT_ID - Your Telegram chat ID (can be obtained from @userinfobot)
  pnl_update_interval_seconds: 300 # Minimum seconds between PnL update notifications per position
  notify_entry: true # Send notifications on entry
  notify_exit: true # Send notifications on exit
  notify_pnl_updates: false # Send periodic PnL updates (throttled)
  notify_pnl_milestones: true # Send notifications for PnL milestones (10%, 20%, etc.)
  pnl_milestones: [10, 20, 30, 50, 100] # PnL percentage milestones to notify
  notify_risk_alerts: true # Send risk alert notifications
  notify_daily_profit_target: true # Telegram when global daily profit cap is hit (entries blocked)
  include_stats_on_exit: true # Include trading stats summary in exit notifications
  notify_stats_at_market_close: true # Send daily trading stats at end of market session (3:30 PM IST)
  # SMC Alert Settings
  smc_alert_cooldown_minutes: 30 # Cooldown between duplicate alerts (same instrument+decision)
  smc_max_alerts_per_session: 2 # Max alerts per instrument per trading session (prevents overtrading)

# AI Integration Configuration
ai:
  enabled: true # Set to true to enable AI integration
  # Timeout settings (in seconds):
  # - OLLAMA_HOST_URL: Remote Ollama server URL (e.g., http://192.168.0.200:11434)
  #   Alternative to OLLAMA_BASE_URL (both are supported)
  # - OLLAMA_BASE_URL: Remote Ollama server URL (legacy, use OLLAMA_HOST_URL if possible)
  # - OLLAMA_TIMEOUT: Request timeout for non-streaming requests (default: 20 seconds)
  # - OLLAMA_STREAM_TIMEOUT: Timeout for streaming requests (default: 120 seconds / 2 minutes)
  #   Increase this if models are slow or responses are long (e.g., 300 for very slow models)
  # - OLLAMA_OPEN_TIMEOUT: Connection timeout for Ollama (default: 5 seconds)
  # - OLLAMA_REQUEST_DELAY_MS: Delay between requests in milliseconds (default: 500ms)
  #   Useful for long streaming responses. Set higher if you experience timeouts.
  # Provider selection:
  # - Development/Test: Uses 'ruby-openai' gem (alexrudall/ruby-openai)
  # - Production: Uses 'openai' gem (official openai-ruby)
  # - Ollama: Automatically selected if OLLAMA_BASE_URL is set
  # - Override: Set OPENAI_PROVIDER env var to 'ruby_openai', 'openai_ruby', or 'ollama'
  #
  # OpenAI API Key: Set OPENAI_API_KEY or OPENAI_ACCESS_TOKEN environment variable
  # Ollama Configuration:
  #   - OLLAMA_BASE_URL: Base URL of Ollama server (e.g., http://192.168.1.11:11434)
  #   - OLLAMA_API_KEY: Optional API key (default: 'ollama')
  #   - OLLAMA_MODEL: Optional - explicitly set model (e.g., 'phi3:mini', 'llama3')
  #     If not set, system automatically fetches available models and selects the best one
  #
  # Technical Analysis Agent Configuration:
  #   - AI_AGENT_MAX_ITERATIONS: Maximum iterations before safety limit (default: 15, range: 3-100)
  #     Controls how many iterations the agent can perform before stopping
  #     Example: export AI_AGENT_MAX_ITERATIONS=20
  #   - AI_AGENT_MAX_CONSECUTIVE_TOOLS: Maximum consecutive tool calls before forcing analysis (default: 8, range: 3-15)
  #     Prevents the agent from getting stuck in tool-calling loops
  #     Example: export AI_AGENT_MAX_CONSECUTIVE_TOOLS=5
  #   - AI_AGENT_STREAM_TIMEOUT: Timeout for streaming responses per iteration (default: 60 seconds)
  #     If AI doesn't respond within this time, iteration is aborted and retried
  #     Example: export AI_AGENT_STREAM_TIMEOUT=30
