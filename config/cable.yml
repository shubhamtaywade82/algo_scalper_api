development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  channel_prefix: algo_scalper_api_development

test:
  adapter: test

# Redis pub/sub, not solid_cable: ticks are pushed from the WS handler, which must never write to the DB or wait on a poll.
production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") %>
  channel_prefix: algo_scalper_api_production
