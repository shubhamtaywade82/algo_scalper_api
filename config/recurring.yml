development:
  instruments_import:
    class: InstrumentsImportJob
    schedule: at 8:45am every day
    queue_name: background
    priority: 1
    description: "Daily DhanHQ instrument master sync — ensures derivative records exist for strike selection"

  portfolio_reset:
    class: PortfolioResetJob
    schedule: at 9:14am every day
    queue_name: background
    priority: 1
    description: "Daily portfolio PnL and drawdown guard reset before market open (9:14 AM)"

  clear_carried_overnight:
    class: ClearCarriedOvernightPositionsJob
    schedule: at 9:15am every day
    queue_name: background
    priority: 2
    description: "Clear BTST/carried-overnight positions at start of trading day (9:15 AM)"

  smc_scanner:
    class: SmcScannerJob
    schedule: every 15 minutes
    queue_name: default
    priority: 10
    description: "SMC + AVRZ scanner for all configured indices - runs every 15 minutes (aligns with 15m MTF candles)"

  ai_agents_cycle:
    class: Ai::AgentsCycleJob
    schedule: every 15 minutes
    queue_name: background
    priority: 8
    description: "Multi-Agent AI cycle (Market Analysis, Risk Management, Strategy Selection, Calibration)"

  ai_technical_analysis_nifty:
    class: AiTechnicalAnalysisJob
    args: ["NIFTY"]
    schedule: at 4:00pm every day
    queue_name: background
    priority: 5
    description: "AI technical analysis for NIFTY - post-close scheduled run; intraday flow is event-driven from tick events"

  ai_technical_analysis_sensex:
    class: AiTechnicalAnalysisJob
    args: ["SENSEX"]
    schedule: at 4:00pm every day
    queue_name: background
    priority: 5
    description: "AI technical analysis for SENSEX - post-close scheduled run; intraday flow is event-driven from tick events"

  dhan_auto_ip_sync:
    class: Dhan::AutoIpUpdaterJob
    schedule: every 30 minutes
    queue_name: background
    priority: 20
    description: "Auto-syncs local public IP with Dhan whitelisting slots when cooldown expires"

  public_ip_log:
    class: PublicIpLogJob
    schedule: every 15 minutes
    queue_name: background
    priority: 25
    description: "Persists public IP last-seen (throttled); dashboard no longer writes public_ip_logs"

  cancel_stuck_orders:
    class: Live::CancelStuckOrdersJob
    schedule: every 1 minute
    queue_name: background
    priority: 4
    description: "Cancels live entry orders DhanHQ never confirmed filled/rejected within the check window"

  daily_close_paper:
    class: Ledger::DailyCloseJob
    schedule: at 3:35pm every day
    queue_name: background
    priority: 6
    description: "Persists paper-mode daily KPI rollup (net PnL, win rate, expectancy, profit factor) after market close"

  daily_close_live:
    class: Ledger::DailyCloseJob
    args: [{ mode: 'live' }]
    schedule: at 3:36pm every day
    queue_name: background
    priority: 6
    description: "Persists live-mode daily KPI rollup after market close"

  tick_staleness_sampler:
    class: DataQuality::TickStalenessSamplerJob
    schedule: every 1 minute
    queue_name: background
    priority: 15
    description: "Samples Live::FeedHealthService's tick-staleness check once a minute to accumulate a daily rate"

  data_quality_daily_check:
    class: DataQuality::DailyCheckJob
    schedule: at 3:40pm every day
    queue_name: background
    priority: 15
    description: "Section 9 data quality KPIs: candle gaps/alignment, instrument mapping accuracy, expired-instrument catalog check, fill price vs real OHLC reconciliation"

production:
  instruments_import:
    class: InstrumentsImportJob
    schedule: at 8:45am every weekday
    queue_name: background
    priority: 1
    description: "Daily DhanHQ instrument master sync — ensures derivative records exist for strike selection"

  portfolio_reset:
    class: PortfolioResetJob
    schedule: at 9:14am every weekday
    queue_name: background
    priority: 1
    description: "Daily portfolio PnL and drawdown guard reset before market open (9:14 AM)"

  clear_carried_overnight:
