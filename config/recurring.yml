development:
  instruments_import:
    class: InstrumentsImportJob
    schedule: at 8:45am every day
    queue_name: background
    priority: 1
    description: "Daily DhanHQ instrument master sync — ensures derivative records exist for strike selection"

  iv_snapshot:
    class: IvSnapshotJob
    schedule: at 8:45am every day
    queue_name: background
    priority: 2
    description: "Captures daily ATM Implied Volatility (IV) for alpha strategy history"

  portfolio_reset:
    class: PortfolioResetJob
    schedule: at 9:15am every day
    queue_name: background
    priority: 1
    description: "Daily portfolio PnL reset (realized, peak, floor, level) before market open"

  clear_carried_overnight:
    class: ClearCarriedOvernightPositionsJob
    schedule: at 9:15am every day
    queue_name: background
    priority: 2
    description: "Clear BTST/carried-overnight positions at start of trading day (9:15 AM)"

  smc_scanner:
    class: SmcScannerJob
    schedule: at 4:00pm every day
    queue_name: background
    priority: 10
    description: "SMC + AVRZ scanner for all configured indices - post-close scheduled run; intraday flow is event-driven from tick events"

  ai_technical_analysis_nifty:
    class: AiTechnicalAnalysisJob
    args: ["NIFTY"]
    schedule: at 4:00pm every day
    queue_name: background
    priority: 5
    description: "AI technical analysis for NIFTY - post-close scheduled run; intraday flow is event-driven from tick events"

  ai_technical_analysis_sensex:
    class: AiTechnicalAnalysisJob
    args: ["SENSEX"]
    schedule: at 4:00pm every day
    queue_name: background
    priority: 5
    description: "AI technical analysis for SENSEX - post-close scheduled run; intraday flow is event-driven from tick events"

  dhan_auto_ip_sync:
    class: Dhan::AutoIpUpdaterJob
    schedule: every 30 minutes
    queue_name: background
    priority: 20
    description: "Auto-syncs local public IP with Dhan whitelisting slots when cooldown expires"

  public_ip_log:
    class: PublicIpLogJob
    schedule: every 15 minutes
    queue_name: background
    priority: 25
    description: "Persists public IP last-seen (throttled); dashboard no longer writes public_ip_logs"

  ai_calibration:
    class: AiCalibrationJob
    queue: background
    schedule: at 7:00am every day
    description: "Daily AI-driven trading calibration — analyzes paper trades and proposes config patches"

  alpha_scanner:
    class: AlphaScanJob
    schedule: every 5 minutes
    queue_name: background
    priority: 10
    description: "Autonomous Alpha Strategy scanner — runs all enabled modules across NIFTY, BANKNIFTY, and SENSEX"

production:
  instruments_import:
    class: InstrumentsImportJob
    schedule: at 8:45am every weekday
    queue_name: background
    priority: 1
    description: "Daily DhanHQ instrument master sync — ensures derivative records exist for strike selection"

  iv_snapshot:
    class: IvSnapshotJob
    schedule: at 8:45am every weekday
    queue_name: background
    priority: 2
    description: "Captures daily ATM Implied Volatility (IV) for alpha strategy history"

  portfolio_reset:
    class: PortfolioResetJob
    schedule: at 9:15am every weekday
    queue_name: background
    priority: 1
    description: "Daily portfolio PnL reset (realized, peak, floor, level) before market open"

  clear_carried_overnight:
    class: ClearCarriedOvernightPositionsJob
    schedule: at 9:15am every weekday
    queue_name: background
    priority: 2
    description: "Clear BTST/carried-overnight positions at start of trading day (9:15 AM)"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  smc_scanner:
    class: SmcScannerJob
    schedule: at 4:00pm every weekday
    queue_name: background
    priority: 10
    description: "SMC + AVRZ scanner - post-close scheduled run on weekdays; intraday flow is event-driven from tick events"

  ai_technical_analysis_nifty:
    class: AiTechnicalAnalysisJob
    args: ["NIFTY"]
    schedule: at 4:00pm every weekday
    queue_name: background
    priority: 5
    description: "AI technical analysis for NIFTY - post-close scheduled run on weekdays; intraday flow is event-driven from tick events"

  ai_technical_analysis_sensex:
    class: AiTechnicalAnalysisJob
    args: ["SENSEX"]
    schedule: at 4:00pm every weekday
    queue_name: background
    priority: 5
    description: "AI technical analysis for SENSEX - post-close scheduled run on weekdays; intraday flow is event-driven from tick events"

  weekly_options_calibration:
    class: WeeklyCalibrationJob
    schedule: every Sunday at 6:00 am Asia/Kolkata
    queue_name: background
    priority: 3
    description: "Weekly ATM±1 options calibration — generates config patch proposal for NIFTY and SENSEX"

  dhan_auto_ip_sync:
    class: Dhan::AutoIpUpdaterJob
    schedule: every 30 minutes
    queue_name: background
    priority: 20
    description: "Auto-syncs local public IP with Dhan whitelisting slots when cooldown expires"

  public_ip_log:
    class: PublicIpLogJob
    schedule: every 15 minutes
    queue_name: background
    priority: 25
    description: "Persists public IP last-seen (throttled); dashboard polling does not write public_ip_logs"

  alpha_scanner:
    class: AlphaScanJob
    schedule: every 5 minutes during market hours
    queue_name: background
    priority: 10
    description: "Autonomous Alpha Strategy scanner — runs all enabled modules across NIFTY, BANKNIFTY, and SENSEX"
