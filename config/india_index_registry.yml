# Canonical identity, instrument, and execution defaults for Indian index options.
# Strategy overlays (capital, premium_band, strategies, etc.) live in config/algo.yml
# indices[] and are merged at runtime by IndiaIndexRegistry.
# Lots must match the exchange (instruments.lot_size); checked 2026-11-02: 65 / 30 / 20.

version: 1

indices:
  NIFTY:
    key: NIFTY
    exchange: NSE
    segment: IDX_I
    sid: "13"
    fno_segment: NSE_FNO
    lot: 65
    strike_step: 50
    execution:
      max_bid_ask_spread_pct: 0.015
      earliest_entry_time: "09:30"

  BANKNIFTY:
    key: BANKNIFTY
    exchange: NSE
    segment: IDX_I
    sid: "25"
    fno_segment: NSE_FNO
    lot: 30
    strike_step: 100
    execution:
      max_bid_ask_spread_pct: 0.015
      earliest_entry_time: "09:30"

  SENSEX:
    key: SENSEX
    exchange: BSE
    segment: IDX_I
    sid: "51"
    fno_segment: BSE_FNO
    lot: 20
    strike_step: 100
    execution:
      max_bid_ask_spread_pct: 0.025
      earliest_entry_time: "09:30"
