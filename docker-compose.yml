services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algo_scalper_api_development
    volumes:
      - pg_data_v15:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algo_scalper_api_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: postgres://postgres:postgres@db:5432/algo_scalper_api_development
      REDIS_URL: redis://redis:6379/0
      DISABLE_TRADING_SERVICES: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "80:80"

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["bin/jobs"]
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: postgres://postgres:postgres@db:5432/algo_scalper_api_development
      REDIS_URL: redis://redis:6379/0
      DISABLE_TRADING_SERVICES: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - "3000:80"

  arch-dashboard:
    build:
      context: ./architecture-dashboard
      dockerfile: Dockerfile
    depends_on: []
    ports:
      - "3003:3003"
    environment:
      - NEXT_TELEMETRY_DISABLED=1

  sidecar:
    build:
      context: ./node-sidecar
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: paper
    depends_on:
      - redis
      - web

volumes:
  pg_data_v15:
  redis_data:

