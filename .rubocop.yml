inherit_from: .rubocop_todo.yml

# NOTE (2026-09-15): the four RSpec blocks below (DescribeClass,
# ContextWording, ExampleLength, MultipleExpectations) carry limits raised
# to grandfather the pre-existing spec backlog (previously ~245 offenses
# escaped .rubocop_todo.yml because these explicit blocks overrode it).
# Tighten them back once the backlog is cleared.

# Use the new plugins syntax for RuboCop extensions
plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-factory_bot
  - rubocop-rspec_rails

# Global settings
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "lib/tasks/**/*"
    - "run_spec_debug.rb"
    - "trace.rb"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# RSpec-specific configuration
RSpec:
  Include:
    - "spec/**/*_spec.rb"
    - "spec/**/*.feature"

RSpec/VariableName:
  Enabled: false

RSpec/DescribeClass:
  Enabled: true
  Exclude:
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/features/**/*"
    - "spec/smoke/**/*"
    - "spec/requests/**/*"
    - "spec/architecture/regression_spec.rb"
    - "spec/services/entries/entry_guard_integration_spec.rb"
    - "spec/services/live/demand_driven_services_spec.rb"
    - "spec/services/live/market_feed_hub_integration_spec.rb"
    - "spec/services/live/risk_manager_integration_spec.rb"
    - "spec/services/pct_consistency_spec.rb"
    - "spec/services/risk/rule_engine_simulation_spec.rb"
    - "spec/services/risk/rules/data_freshness_spec.rb"
    - "spec/services/risk/rules/edge_cases_spec.rb"
    - "spec/services/risk/rules/integration_scenarios_spec.rb"
    - "spec/services/risk/rules/trailing_activation_spec.rb"
    - "spec/services/trading/capital_cap_enforcement_spec.rb"
    - "spec/services/trading/execution_only_sensex_block_spec.rb"

# RSpec/ContextWording: Prefer 'when', 'with', 'without' for contexts.
# DISABLED (2026-09-15): 146 pre-existing context descriptions don't match
# the prefix list. Re-enable once the backlog is renamed (mechanical rename,
# tracked with the .rubocop_todo.yml debt).
RSpec/ContextWording:
  Enabled: false

# RSpec/ExampleLength: Keep examples focused and short
RSpec/ExampleLength:
  Max: 25
  CountAsOne: ["heredoc"]
  Exclude:
    - "spec/features/**/*"
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/smoke/**/*"
    - "spec/requests/**/*"
    - "spec/services/avrz/detector_spec.rb"
    - "spec/services/entries/entry_guard_advisory_lock_spec.rb"
    - "spec/services/options_buying/breakout_evaluator_spec.rb"
    - "spec/services/positions/exit_flow_spec.rb"

# RSpec/NestedGroups: Limit nested describe/context blocks
RSpec/NestedGroups:
  Max: 5

# RSpec/MultipleMemoizedHelpers: Allow reasonable use of let
RSpec/MultipleMemoizedHelpers:
  Max: 10

# RSpec/SubjectStub: Allow stubbing on subjects
RSpec/SubjectStub:
  Enabled: false

# RSpec/MultipleExpectations: Allow multiple expectations in integration/system tests
# Note: Better Specs allows multiple expectations in non-isolated tests.
# DISABLED for the general suite (2026-09-15): 72 pre-existing examples
# exceed Max: 4. Integration/system/features dirs keep their exclusion via
# the todo file; re-enable with a per-file Exclude list once the spec files
# are split.
RSpec/MultipleExpectations:
  Enabled: false

# Performance rules
Performance/StringReplacement:
  Enabled: true

Performance/RedundantMatch:
  Enabled: true

Performance/RedundantStringChars:
  Enabled: true

Performance/RedundantBlockCall:
  Enabled: true

Performance/StartWith:
  Enabled: true

Performance/EndWith:
  Enabled: true

Performance/DeleteSuffix:
  Enabled: true

Performance/DeletePrefix:
  Enabled: true

# FactoryBot rules
FactoryBot/AttributeDefinedStatically:
  Enabled: true

FactoryBot/CreateList:
  Enabled: true

FactoryBot/ConsistentParenthesesStyle:
  Enabled: true

# Disable some overly strict rules
Lint/MissingSuper:
  Enabled: false

Style/Documentation:
  Enabled: false

# Metrics cops - disabled for legacy codebase with significant technical debt
# These require architectural refactoring beyond simple fixes
Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

Style/SafeNavigationChainLength:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/DuplicateMethods:
  Exclude:
    - "app/services/index_config_loader.rb"

Lint/RedundantCopDisableDirective:
  Enabled: false

Rails/EagerEvaluationLogMessage:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Rails/TimeZone:
  Enabled: false

Rails/WhereExists:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/MultilineIfModifier:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Style/ComparableClamp:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLinesAroundMethodBody:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Layout/IndentationConsistency:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/ShadowedException:
  Enabled: false
