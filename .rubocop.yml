# Use the new plugins syntax for RuboCop extensions
plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-factory_bot
  - rubocop-rspec_rails

# Global settings
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "lib/tasks/**/*"
    - "run_spec_debug.rb"
    - "trace.rb"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# RSpec-specific configuration
RSpec:
  Include:
    - "spec/**/*_spec.rb"
    - "spec/**/*.feature"

RSpec/VariableName:
  Enabled: false

RSpec/DescribeClass:
  Enabled: true
  Exclude:
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/features/**/*"

# RSpec/ContextWording: Prefer 'when', 'with', 'without' for contexts
RSpec/ContextWording:
  Enabled: true
  Prefixes:
    - when
    - with
    - without
    - if
    - unless
    - for
    - that

# RSpec/ExampleLength: Keep examples focused and short
RSpec/ExampleLength:
  Max: 25
  CountAsOne: ["heredoc"]
  Exclude:
    - "spec/features/**/*"
    - "spec/integration/**/*"
    - "spec/system/**/*"

# RSpec/NestedGroups: Limit nested describe/context blocks
RSpec/NestedGroups:
  Max: 5

# RSpec/MultipleMemoizedHelpers: Allow reasonable use of let
RSpec/MultipleMemoizedHelpers:
  Max: 10

# RSpec/SubjectStub: Allow stubbing on subjects
RSpec/SubjectStub:
  Enabled: false

# RSpec/MultipleExpectations: Allow multiple expectations in integration/system tests
# Note: Better Specs allows multiple expectations in non-isolated tests
RSpec/MultipleExpectations:
  Enabled: true
  Max: 4 # Allow up to 4 expectations per test
  Exclude:
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/features/**/*"

# Performance rules
Performance/StringReplacement:
  Enabled: true

Performance/RedundantMatch:
  Enabled: true

Performance/RedundantStringChars:
  Enabled: true

Performance/RedundantBlockCall:
  Enabled: true

Performance/StartWith:
  Enabled: true

Performance/EndWith:
  Enabled: true

Performance/DeleteSuffix:
  Enabled: true

Performance/DeletePrefix:
  Enabled: true

# FactoryBot rules
FactoryBot/AttributeDefinedStatically:
  Enabled: true

FactoryBot/CreateList:
  Enabled: true

FactoryBot/ConsistentParenthesesStyle:
  Enabled: true

# Disable some overly strict rules
Lint/MissingSuper:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - "config/**/*"
    - "spec/**/*"
    - "db/migrate/**/*"
    - "app/services/**/*"
    - "app/models/concerns/**/*"

Metrics/AbcSize:
  Max: 30
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/index_technical_analyzer.rb"
    - "app/services/positions/drawdown_schedule.rb"
    - "app/services/live/tick_query.rb"
    - "app/services/dhan/**/*"
    - "app/services/trading/capital_allocator.rb"

Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/index_technical_analyzer.rb"
    - "app/services/positions/drawdown_schedule.rb"
    - "app/services/live/tick_query.rb"

Metrics/PerceivedComplexity:
  Max: 15
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/index_technical_analyzer.rb"
    - "app/services/positions/drawdown_schedule.rb"
    - "app/services/live/tick_query.rb"

Metrics/MethodLength:
  Enabled: true
  CountAsOne:
    - "array"
    - "hash"
    - "heredoc"
  Max: 30
  Exclude:
    - "spec/**/*"
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/index_technical_analyzer.rb"

Metrics/ClassLength:
  Max: 100
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/models/position_tracker.rb"
    - "app/services/index_technical_analyzer.rb"
    - "app/services/index_config_loader.rb"
    - "app/services/entries/bos_entry_engine.rb"
    - "app/services/indicators/supertrend.rb"
    - "app/services/options/chain_analyzer.rb"
    - "app/services/trading/instrument_execution_profile.rb"

Metrics/ModuleLength:
  Max: 100
  Exclude:
    - "app/services/live/risk_manager_service/**/*"
    - "app/services/live/tick_query.rb"

Metrics/ParameterLists:
  Max: 5
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/entries/bos_entry_engine.rb"
    - "app/services/trading/capital_allocator.rb"

Naming/PredicateMethod:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - io
    - id
    - to
    - by
    - on
    - in
    - at
    - ip
    - db
    - tf
    - ts

Style/OpenStructUse:
  Enabled: false

Style/SafeNavigationChainLength:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/DuplicateMethods:
  Exclude:
    - "app/services/index_config_loader.rb"

Rails/EagerEvaluationLogMessage:
  Enabled: false

Rails/TimeZone:
  Exclude:
    - "app/services/live/time_regime_service.rb"

Rails/WhereExists:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/MultilineIfModifier:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Style/ComparableClamp:
  Enabled: false

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '\s*#'
    - '\s*describe'
    - '\s*context'
    - '\s*it\s'
    - '\s*expect'
  Exclude:
    - "app/services/entries/entry_guard.rb"
    - "app/services/signal/engine.rb"
    - "app/services/entries/bos_entry_engine.rb"
    - "app/services/trading/capital_allocator.rb"
    - "app/models/position_tracker.rb"

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLinesAroundMethodBody:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/IndentationWidth:
  Exclude:
    - "app/services/entries/entry_guard.rb"

Layout/IndentationConsistency:
  Exclude:
    - "app/services/entries/entry_guard.rb"

Layout/TrailingEmptyLines:
  Exclude:
    - "app/models/instrument.rb"

Naming/VariableNumber:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/ShadowedException:
  Enabled: false
