# Use the new plugins syntax for RuboCop extensions
plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-factory_bot
  - rubocop-rspec_rails

# Global settings
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/**/*"
    - "tmp/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "lib/tasks/**/*"
    - "run_spec_debug.rb"
    - "trace.rb"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# RSpec-specific configuration
RSpec:
  Include:
    - "spec/**/*_spec.rb"
    - "spec/**/*.feature"

RSpec/VariableName:
  Enabled: false

RSpec/DescribeClass:
  Enabled: true
  Exclude:
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/features/**/*"

# RSpec/ContextWording: Prefer 'when', 'with', 'without' for contexts
RSpec/ContextWording:
  Enabled: true
  Prefixes:
    - when
    - with
    - without
    - if
    - unless
    - for
    - that

# RSpec/ExampleLength: Keep examples focused and short
RSpec/ExampleLength:
  Max: 25
  CountAsOne: ["heredoc"]
  Exclude:
    - "spec/features/**/*"
    - "spec/integration/**/*"
    - "spec/system/**/*"

# RSpec/NestedGroups: Limit nested describe/context blocks
RSpec/NestedGroups:
  Max: 5

# RSpec/MultipleMemoizedHelpers: Allow reasonable use of let
RSpec/MultipleMemoizedHelpers:
  Max: 10

# RSpec/SubjectStub: Allow stubbing on subjects
RSpec/SubjectStub:
  Enabled: false

# RSpec/MultipleExpectations: Allow multiple expectations in integration/system tests
# Note: Better Specs allows multiple expectations in non-isolated tests
RSpec/MultipleExpectations:
  Enabled: true
  Max: 4 # Allow up to 4 expectations per test
  Exclude:
    - "spec/integration/**/*"
    - "spec/system/**/*"
    - "spec/features/**/*"

# Performance rules
Performance/StringReplacement:
  Enabled: true

Performance/RedundantMatch:
  Enabled: true

Performance/RedundantStringChars:
  Enabled: true

Performance/RedundantBlockCall:
  Enabled: true

Performance/StartWith:
  Enabled: true

Performance/EndWith:
  Enabled: true

Performance/DeleteSuffix:
  Enabled: true

Performance/DeletePrefix:
  Enabled: true

# FactoryBot rules
FactoryBot/AttributeDefinedStatically:
  Enabled: true

FactoryBot/CreateList:
  Enabled: true

FactoryBot/ConsistentParenthesesStyle:
  Enabled: true

# Disable some overly strict rules
Lint/MissingSuper:
  Enabled: false

Style/Documentation:
  Enabled: false

# Metrics cops - disabled for legacy codebase with significant technical debt
# These require architectural refactoring beyond simple fixes
Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

Style/SafeNavigationChainLength:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/DuplicateMethods:
  Exclude:
    - "app/services/index_config_loader.rb"

Lint/RedundantCopDisableDirective:
  Enabled: false

Rails/EagerEvaluationLogMessage:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Rails/TimeZone:
  Enabled: false

Rails/WhereExists:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/MultilineIfModifier:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Style/ComparableClamp:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLinesAroundMethodBody:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Layout/IndentationConsistency:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Layout/TrailingWhitespace:
  Enabled: true

Naming/VariableNumber:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/ShadowedException:
  Enabled: false
